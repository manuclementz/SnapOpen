[Settings]
; Overrides several Skyrim.ini loading-screen/fade durations to make transitions snappier.
; Set to 0 to leave your own Skyrim.ini settings alone.
bOverrideFadeSettings=1

; Experimental. Also speeds up door animations when NPCs use them, not just the player.
; Off by default - untested for side effects on AI/scripts that expect the door to take a beat.
bExperimentalNPCDoors=0
