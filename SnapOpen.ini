[Settings]
; shortens skyrim.ini fade/loading durations too. 0 = use skyrim.ini settings, 1 = override with SnapOpen settings
bOverrideFadeSettings=1

; experimental: speeds up doors for npcs. Off by default, needs more testing
bExperimentalNPCDoors=0

; set to 0 to stop writing SnapOpen.log entirely
bEnableLogging=1
